<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Escopo - Editar Proposta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../dashboard/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <aside class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-brand text-center">
                <i class="fa-solid fa-layer-group"></i> 
            </div>
            <nav class="sidebar-menu d-flex flex-column gap-2 px-3">
                <a href="../dashboard/index.html"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a>
                <a href="../briefing/index.html" class="active"><i class="fa-solid fa-plus me-2"></i> Novos Escopos</a>
                <a href="../propostas/index.html"><i class="fa-solid fa-file-invoice-dollar"></i> Propostas</a>
                <a href="../tecnologias/index.html"><i class="fa-solid fa-code me-2"></i> Tecnologias</a>
                <a href="../configuracoes/index.html"><i class="fa-solid fa-gear me-2"></i> Configurações</a>
            </nav>
        </aside>

        <main id="page-content-wrapper" class="w-100 p-4">
            
            <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary-subtle">
                <div>
                    <h1 class="h4 mb-0 fw-bold text-white"><i class="fa-solid fa-sliders text-purple me-2"></i>Ajustar Escopo Gerado</h1>
                    <p class="text-muted small mb-0">Projeto: <span class="text-white fw-medium" id="nome-projeto-header">Carregando...</span></p>
                </div>
                <span class="text-muted small">Passo 2 de 3: Ajuste Técnico</span>
            </header>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="custom-card p-4 mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="h6 fw-bold mb-0 text-uppercase tracking-wider text-muted">Módulos Sugeridos pela IA</h2>
                            <button class="btn btn-sm btn-outline-purple" id="btn-add-modulo">
                                <i class="fa-solid fa-plus me-1"></i> Adicionar Módulo
                            </button>
                        </div>

                        <div id="modules-container" class="d-flex flex-column gap-3">
                            <!-- JS inserirá os módulos aqui -->
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="custom-card p-4 sticky-top" style="top: 25px;">
                        <h2 class="h6 fw-bold mb-4 text-uppercase tracking-wider text-muted">Resumo da Proposta</h2>
                        
                        <div class="mb-4">
                            <label for="valor-hora" class="form-label text-muted small fw-bold">VALOR DA SUA HORA (R$)</label>
                            <input type="number" class="form-control custom-input fw-bold" id="valor-hora" value="100">
                        </div>

                        <div class="d-flex justify-content-between align-items-center my-3 border-top border-bottom border-secondary-subtle py-3">
                            <span class="text-muted small fw-bold">TOTAL DE HORAS:</span>
                            <span class="h5 mb-0 fw-bold text-white" id="total-horas">0h</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="text-muted small fw-bold">PREÇO ESTIMADO:</span>
                            <span class="h4 mb-0 fw-bold text-purple-light" id="preco-final">R$ 0,00</span>
                        </div>

                        <button class="btn btn-purple-neon w-100 py-3 fw-bold" id="btn-salvar-proposta">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Salvar e Visualizar
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../transitions.js"></script>
    <script src="script.js"></script>
</body>
</html>

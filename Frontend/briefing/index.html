<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Escopo - Novo Briefing</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS compartilhado da dashboard adaptado + estilo local -->
    <link rel="stylesheet" href="../dashboard/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- BARRA LATERAL (Reutilizando a estrutura) -->
        <aside class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-brand text-center">
                <i class="fa-solid fa-layer-group"></i> 
            </div>
            <nav class="sidebar-menu d-flex flex-column gap-2 px-3">
                <a href="../dashboard/index.html"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a>
                <a href="#" class="active"><i class="fa-solid fa-plus me-2"></i> Novos Escopos</a>
                <a href="#"><i class="fa-solid fa-file-invoice-dollar"></i> Propostas</a>
                <a href="#"><i class="fa-solid fa-code me-2"></i> Tecnologias</a>
                <a href="#"><i class="fa-solid fa-gear me-2"></i> Configurações</a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main id="page-content-wrapper" class="w-100 p-4">
            
            <!-- HEADER -->
            <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary-subtle">
                <h1 class="h4 mb-0 fw-bold text-white"><i class="fa-solid fa-wand-magic-sparkles text-purple me-2"></i>Novo Briefing para IA</h1>
                <span class="text-muted small">Passo 1 de 3: Coleta de Dados</span>
            </header>

            <!-- FORMULÁRIO CENTRALIZADO -->
            <div class="row justify-content-center">
                <div class="col-xl-8 col-lg-10">
                    <div class="custom-card p-4 shadow">
                        
                        <form id="form-briefing">
                            <!-- Cliente e Projeto -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="cliente" class="form-label text-muted small fw-bold">NOME DO CLIENTE / EMPRESA</label>
                                    <input type="text" class="form-control custom-input" id="cliente" placeholder="Ex: Fábrica de Peças LTDA" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="projeto" class="form-label text-muted small fw-bold">NOME DO PROJETO</label>
                                    <input type="text" class="form-control custom-input" id="projeto" placeholder="Ex: Sistema de PCP Interno" required>
                                </div>
                            </div>

                            <!-- Descrição do Problema -->
                            <div class="mb-4">
                                <label for="descricao" class="form-label text-muted small fw-bold">DESCRIÇÃO DA SOLICITAÇÃO (O QUE O CLIENTE QUER?)</label>
                                <textarea class="form-control custom-input" id="descricao" rows="6" placeholder="Descreva os requisitos passados pelo cliente... Ex: 'Precisa de um sistema web para registrar ordens de produção, gerar relatórios de gargalo em tempo real e controle de estoque de matéria-prima...'" required></textarea>
                            </div>

                            <!-- Tecnologias (Dinâmico com JS) -->
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">STACk TECNOLÓGICA SUGERIDA</label>
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control custom-input" id="input-tech" placeholder="Ex: Python, FastAPI, React, MySQL">
                                    <button class="btn btn-purple" type="button" id="btn-add-tech"><i class="fa-solid fa-plus"></i></button>
                                </div>
                                <!-- Container onde o JS vai renderizar as tags -->
                                <div id="tech-tags-container" class="d-flex flex-wrap gap-2 mt-2">
                                    <!-- Tags vão aparecer aqui dinamicamente -->
                                </div>
                            </div>

                            <!-- Botões de Ação -->
                            <div class="d-flex justify-content-end gap-3 mt-5">
                                <a href="../dashboard/index.html" class="btn btn-outline-secondary px-4 py-2">Cancelar</a>
                                <button type="submit" class="btn btn-purple-neon px-5 py-2 fw-bold" id="btn-submit">
                                    <span id="btn-text">Gerar Escopo com IA</span>
                                    <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../transitions.js"></script>
    <!-- Nosso JS Local -->
    <script src="script.js"></script>
</body>
</html>
